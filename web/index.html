<!DOCTYPE html>
<html>
<head>
<base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="description" content="Áreas Verdes Comuna de Doñihue">
  <meta name="version" content="1.0.2-20260827">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Áreas Verdes Doñihue">
  
  <!-- Motor Adaptativo: Prevenir zoom automático en inputs -->
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#1565C0">
  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <title>Áreas Verdes - Comuna de Doñihue</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background-color: #1565C0; /* Azul corporativo sólido */
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
    }

    /* Splash screen adaptativo */
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      animation: fadeIn 0.8s ease-in;
      width: 100%;
      height: 100%;
      padding: clamp(16px, 4vw, 56px);
    }

    #logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #logo-container img {
      display: block;
      width: 60vw; /* 60% del ancho de la ventana */
      max-width: 600px; /* Máximo 600px */
      max-height: 60vh; /* Máximo 60% de la altura */
      height: auto;
      object-fit: contain;
    }

    #spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #texto {
      color: white;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Oculta el splash cuando Flutter carga */
    .flutter-loaded #splash { display: none; }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div id="logo-container">
      <img src="assets/logowebactualizado.png" alt="Logo Áreas Verdes Doñihue">
    </div>
    <div id="spinner"></div>
    <div id="texto">Cargando Áreas Verdes...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Manejo de redirección desde 404.html para GitHub Pages SPA
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect != location.href) {
        history.replaceState(null, null, redirect);
      }
    })();

    // Registrar Service Worker para actualizaciones automáticas
    // Se desactiva al abrir desde un archivo local instalado en otra ruta.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registrado:', registration.scope);
            
            // Verificar actualizaciones cada 60 segundos
            setInterval(() => {
              registration.update();
            }, 60000);
            
            // Escuchar actualizaciones
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Nueva versión disponible
                  console.log('[PWA] Nueva versión disponible. Recargando...');
                  // Recargar automáticamente después de 2 segundos
                  setTimeout(() => {
                    window.location.reload();
                  }, 2000);
                }
              });
            });
          })
          .catch((error) => {
            console.error('[PWA] Error al registrar Service Worker:', error);
          });
      });
    }

    // Oculta el splash cuando Flutter termina de cargar
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('splash').style.display = 'none';
    });
  </script>
</body>
</html>
