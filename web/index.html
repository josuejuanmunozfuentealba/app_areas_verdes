<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f6" />
    <title>Áreas Verdes · Doñihue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { forest: '#276749', ink: '#17221d', mist: '#f7f8f6', line: '#e4e9e5' }, boxShadow: { soft: '0 10px 30px rgba(23,34,29,.06)' } } } }
    </script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f8f6; color: #17221d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      const icons = {
        grid: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-5 w-5"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>,
        map: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-5 w-5"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>,
        clipboard: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-5 w-5"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h4"/></svg>,
        alert: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="h-5 w-5"><path d="m12 3 9 17H3L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg>,
        plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-4 w-4"><path d="M12 5v14M5 12h14"/></svg>,
        chevron: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-4 w-4"><path d="m9 18 6-6-6-6"/></svg>
      };
      function App() {
        const [active, setActive] = useState('Inicio');
        const [notice, setNotice] = useState('');
        const nav = [['Inicio','grid'],['Catastro de inmuebles','map'],['Inspección técnica','clipboard'],['Inspección de urgencia','alert']];
        const open = (name) => { setActive(name); setNotice(name === 'Inicio' ? '' : 'Vista de ' + name + ' seleccionada'); };
        return <div className="min-h-screen lg:flex">
          <aside className="hidden lg:flex w-[264px] shrink-0 flex-col border-r border-line bg-white px-4 py-5">
            <div className="flex items-center gap-3 px-3 pb-8"><div className="flex h-10 w-10 items-center justify-center rounded-xl bg-forest text-white font-bold tracking-tight">AV</div><div><p className="text-sm font-bold tracking-tight">Áreas Verdes</p><p className="text-xs text-slate-500">Municipalidad de Doñihue</p></div></div>
            <p className="px-3 pb-2 text-[10px] font-semibold uppercase tracking-[.16em] text-slate-400">Operación</p>
            <nav className="flex flex-col gap-1">{nav.map(([label, icon]) => <button key={label} onClick={() => open(label)} className={'flex items-center gap-3 rounded-xl px-3 py-3 text-left text-sm transition ' + (active === label ? 'bg-emerald-50 font-semibold text-forest' : 'text-slate-600 hover:bg-slate-50 hover:text-ink')}>{icons[icon]}<span>{label}</span></button>)}</nav>
            <div className="mt-auto rounded-2xl bg-mist p-4"><p className="text-xs font-semibold text-ink">Sesión activa</p><p className="mt-1 text-xs leading-5 text-slate-500">Tus inspecciones se sincronizan de forma segura.</p><button className="mt-3 text-xs font-semibold text-forest hover:underline">Ver configuración</button></div>
          </aside>
          <main className="min-w-0 flex-1">
            <header className="flex h-[76px] items-center justify-between border-b border-line bg-white px-5 sm:px-8"><div className="lg:hidden flex items-center gap-2"><div className="flex h-9 w-9 items-center justify-center rounded-xl bg-forest text-xs font-bold text-white">AV</div><span className="text-sm font-bold">Áreas Verdes</span></div><div className="hidden lg:block"><p className="text-sm font-medium text-slate-500">Martes, 14 de octubre de 2026</p></div><div className="flex items-center gap-3"><button className="rounded-xl border border-line bg-white px-3 py-2 text-sm font-medium text-slate-600 shadow-sm hover:bg-slate-50">Ayuda</button><div className="flex h-9 w-9 items-center justify-center rounded-full bg-amber-100 text-xs font-bold text-amber-800">FL</div></div></header>
            <div className="mx-auto max-w-[1180px] px-5 py-8 sm:px-8 lg:py-10">
              {notice && <div className="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-forest">{notice}</div>}
              <div className="mb-8 flex flex-col justify-between gap-5 sm:flex-row sm:items-end"><div><p className="mb-2 text-sm font-semibold text-forest">Panel de gestión</p><h1 className="text-3xl font-bold tracking-[-.03em] text-ink sm:text-4xl">¿Qué necesitas hacer?</h1><p className="mt-3 max-w-xl text-sm leading-6 text-slate-500">Selecciona una acción para continuar con la gestión de áreas verdes de la comuna.</p></div><button onClick={() => setNotice('Nueva plaza lista para registrar')} className="inline-flex items-center justify-center gap-2 rounded-xl bg-forest px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-[#20583e]">{icons.plus} Nueva plaza</button></div>
              <section className="grid gap-4 md:grid-cols-2">
                <ActionCard icon={icons.map} tone="green" title="Catastro de inmuebles" text="Consulta, registra y actualiza la información de plazas y áreas verdes." onClick={() => open('Catastro de inmuebles')} />
                <ActionCard icon={icons.clipboard} tone="blue" title="Inspección técnica" text="Realiza una revisión completa del estado y equipamiento de cada espacio." onClick={() => open('Inspección técnica')} />
                <ActionCard icon={icons.alert} tone="amber" title="Inspección de urgencia" text="Registra rápidamente incidencias que requieren atención prioritaria." onClick={() => open('Inspección de urgencia')} />
              </section>
              <section className="mt-8 rounded-2xl border border-line bg-white p-5 shadow-soft sm:p-6"><div className="flex items-center justify-between"><div><h2 className="text-base font-bold">Actividad reciente</h2><p className="mt-1 text-sm text-slate-500">Últimas acciones realizadas en el sistema</p></div><button className="flex items-center gap-1 text-sm font-semibold text-forest hover:underline">Ver todo {icons.chevron}</button></div><div className="mt-6 grid gap-3 md:grid-cols-3"><Stat label="Plazas registradas" value="77" detail="Catastro actualizado"/><Stat label="Inspecciones este mes" value="24" detail="+12% vs. mes anterior"/><Stat label="Incidencias pendientes" value="08" detail="3 de alta prioridad"/></div></section>
            </div>
          </main>
        </div>;
      }
      function ActionCard({icon, tone, title, text, onClick}) { const colors = {green:'bg-emerald-50 text-forest', blue:'bg-sky-50 text-sky-700', amber:'bg-amber-50 text-amber-700'}; return <button onClick={onClick} className="group flex min-h-[174px] flex-col rounded-2xl border border-line bg-white p-6 text-left shadow-soft transition hover:-translate-y-0.5 hover:border-emerald-200 hover:shadow-lg"><div className="flex items-start justify-between"><div className={'flex h-11 w-11 items-center justify-center rounded-xl ' + colors[tone]}>{icon}</div><span className="text-slate-300 transition group-hover:translate-x-1 group-hover:text-forest">{icons.chevron}</span></div><div className="mt-6"><h2 className="text-base font-bold text-ink">{title}</h2><p className="mt-2 max-w-sm text-sm leading-5 text-slate-500">{text}</p></div></button> }
      function Stat({label,value,detail}) { return <div className="rounded-xl border border-line bg-mist p-4"><p className="text-xs font-medium text-slate-500">{label}</p><p className="mt-2 text-2xl font-bold tracking-tight text-ink">{value}</p><p className="mt-1 text-xs text-forest">{detail}</p></div> }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
