<!DOCTYPE html>
<html>
<head>
  <base href="/app_areas_verdes/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Áreas Verdes Comuna de Doñihue">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Áreas Verdes Doñihue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Áreas Verdes - Comuna de Doñihue</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1565C0; /* Azul corporativo sólido */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      overflow: hidden;
      padding: 56px; /* 2 cm de margen en todos los lados */
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      animation: fadeIn 0.8s ease-in;
      width: 100%;
      height: 100%;
    }

    #logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    #logo-container img {
      display: block;
      width: 60vw; /* 60% del ancho de la ventana */
      max-width: 600px; /* Máximo 600px */
      max-height: 60vh; /* Máximo 60% de la altura */
      height: auto;
      object-fit: contain;
    }

    #spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #texto {
      color: white;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Oculta el splash cuando Flutter carga */
    .flutter-loaded #splash { display: none; }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <div id="logo-container">
      <img src="assets/logowebactualizado.png" alt="Logo Áreas Verdes Doñihue">
    </div>
    <div id="spinner"></div>
    <div id="texto">Cargando Áreas Verdes...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Registrar Service Worker para actualizaciones automáticas
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[PWA] Service Worker registrado:', registration.scope);
            
            // Verificar actualizaciones cada 60 segundos
            setInterval(() => {
              registration.update();
            }, 60000);
            
            // Escuchar actualizaciones
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Nueva versión disponible
                  console.log('[PWA] Nueva versión disponible. Recargando...');
                  // Recargar automáticamente después de 2 segundos
                  setTimeout(() => {
                    window.location.reload();
                  }, 2000);
                }
              });
            });
          })
          .catch((error) => {
            console.error('[PWA] Error al registrar Service Worker:', error);
          });
      });
    }

    // Oculta el splash cuando Flutter termina de cargar
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('splash').style.display = 'none';
    });
  </script>
</body>
</html>
